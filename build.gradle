plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT' apply(false)
    id 'net.neoforged.moddev.legacyforge' version '2.0.77' apply(false)
    id 'org.jetbrains.kotlin.jvm' version "2.0.0" apply false
    id 'com.fueledbycaffeine.autoservice' version "0.1.4" apply false
}

repositories {
    mavenCentral()
}

subprojects {
    apply plugin: "kotlin"
    // Our replacement for arch's @ExpectPlatform
    apply plugin: "com.fueledbycaffeine.autoservice"

    sourceSets {
        main.kotlin.srcDirs = ['src/main/java', 'src/main/kotlin']
    }

    compileKotlin {
        source(project(":common").sourceSets.main.allSource)
        inputs.file "../gradle.properties"
    }

    kotlin {
        jvmToolchain(17)
    }
}
// If you're looking to add project-wide repositories or dependencies, see multiloader-common.gradle instead
